# Course benchmark: 24 years of daily radiation, history-only inputs.
# All paths are relative to the project root.
data:
  source: csv
  unit: "W/m²"
  site: Course benchmark
  raw_dir: data/raw
  pattern: "daily_solar_*.csv"
  max_fill_gap: 2          # forward-fill input gaps of at most this many days

features:
  n_lags: 7
  rolling_window: 7
  horizons: 7

split:                      # split by the forecast origin date t
  train_end: "2006-12-31"
  val_end: "2009-12-31"     # validation = 2007-2009 (three full years)
  test_start: "2011-01-01"  # 2010 is left out: 64% of its days are unusable

baselines:
  climatology_smooth_days: 15
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]
  xgboost:
    n_estimators: 600
    learning_rate: 0.03
    max_depth: 3
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 40

model:
  hidden: [128, 64]
  dropout: 0.2
  attention_dim: 16
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 200
  patience: 15
  seeds: [0, 1, 2, 3, 4]
  architectures: [mlp, attention]

uncertainty:
  mc_samples: 100
  interval: 0.80            # nominal coverage of the prediction interval

seed: 42
models_dir: models
reports_dir: reports
