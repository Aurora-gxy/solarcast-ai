[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarcast"
version = "0.1.0"
description = "Multi-horizon solar radiation forecasting with honest baselines and uncertainty"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dl = ["torch>=2.1"]
app = ["streamlit>=1.50", "plotly>=5.18"]
dev = ["pytest>=7.4"]
all = ["torch>=2.1", "streamlit>=1.50", "plotly>=5.18", "pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
